name: BRAHMA-SOUL PERSISTENCE

on:
  schedule:
    - cron: '0 * * * *' # Hourly
  workflow_dispatch:

permissions:
  contents: write

jobs:
  evolve:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Soul
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Execute Soul Cycle
        run: python soul_engine.py

      - name: Persist Evolution
        run: |
          git config --global user.name "BRAHMA-SOUL"
          git config --global user.email "soul@brahma-net.ultra"
          git add SOUL_LEDGER.md state.json
          git commit -m "Soul Evolution: Cycle $(python -c 'import json; print(json.load(open("state.json")))["cycle"]') complete"
          git push
